name: 판매처 수집
on:
  schedule:
    - cron: '30 10 1,11,21 * *'   # 19:30 KST (1·11·21일)
  workflow_dispatch:
  push:
    paths: ['data/raw/RUN']
permissions:
  contents: write
concurrency:
  group: scrape
  cancel-in-progress: false
jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests beautifulsoup4
      - run: python data/gh_scrape.py
      - name: 결과 올리기
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898242+github-actions[bot]@users.noreply.github.com"
          git add data/raw
          git commit -m "판매처 수집 자료 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M KST')" || echo "변경 없음"
          for i in 1 2 3; do git pull --rebase -X theirs origin main && git push && break; sleep 5; done
