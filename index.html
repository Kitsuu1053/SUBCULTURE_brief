<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>서브컬쳐 브리핑</title>
<style>
:root{
  --bg-top:#eef7f9; --bg-mid:#a9d3dc; --bg-bot:#5e9eae;
  --np:#3e2f84; --np-2:#5a4aa8; --np-bg:rgba(62,47,132,.5);
  --cherry:#e0457b; --jp:#bc002d; --kr:#003478;
  --gold:#d9b44a; --grey:#8a99a6; --grey-bg:rgba(138,153,166,.5);
  --ink:#1d3440; --ink-soft:#4a6370;
  --glass:rgba(255,255,255,.22); --edge:rgba(255,255,255,.5);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font-family:"Pretendard","Apple SD Gothic Neo","Noto Sans KR","Noto Sans JP","Malgun Gothic",system-ui,sans-serif;color:var(--ink);
  background:linear-gradient(180deg,var(--bg-top) 0%,var(--bg-mid) 55%,var(--bg-bot) 100%)}
#tri{position:fixed;inset:0;z-index:0;pointer-events:none}
#logoBg{position:fixed;right:3vw;bottom:2vh;width:34vh;height:34vh;z-index:0;pointer-events:none}
.noscroll{scrollbar-width:none}.noscroll::-webkit-scrollbar{display:none}
.glass{position:relative;border-radius:16px;border:1px solid var(--edge);
  background:linear-gradient(210deg,rgba(255,255,255,.42) 0%,rgba(255,255,255,.14) 45%,rgba(255,255,255,.06) 70%,rgba(30,60,70,.08) 100%),var(--glass);
  backdrop-filter:blur(16px) saturate(1.1);-webkit-backdrop-filter:blur(16px) saturate(1.1);
  box-shadow:0 8px 28px rgba(30,60,70,.10),inset 0 1px 0 rgba(255,255,255,.35)}
.glass::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:radial-gradient(120% 80% at 85% 0%,rgba(255,255,255,.26),rgba(255,255,255,0) 55%)}
.app{position:relative;z-index:1;height:100vh;display:grid;grid-template-rows:auto 1fr;gap:14px;padding:18px 24px}
header{display:flex;align-items:center;gap:18px;padding:14px 22px}
.title{font-size:34px;font-weight:900;letter-spacing:-.03em}
.upd{font-size:13px;color:var(--ink-soft);margin-top:3px;display:flex;align-items:center;gap:5px}
.upd svg{width:14px;height:14px}
/* 슬라이더 토글 */
/* 라이브러리 */
.tile.sold .im img{filter:grayscale(1) brightness(.9)}
.tile .bd2{position:relative;padding-bottom:56px}
.tile .wl{position:absolute;right:10px;bottom:8px;height:44px;display:flex;align-items:center}
.tile .wl img{height:44px;width:auto;max-width:220px;object-fit:contain;object-position:right center}
.tile .wl b{font-size:10.5px;font-weight:900;color:var(--np);background:rgba(255,255,255,.7);border:1px solid rgba(62,47,132,.25);border-radius:6px;padding:2px 7px}
.alt{font-size:11.5px;margin-top:2px}.alt summary{cursor:pointer;color:var(--np);font-weight:800}
.alt a{display:block;color:var(--ink-soft);text-decoration:none;padding:2px 0}.alt a:hover{color:var(--ink)}.alt .me{color:var(--ink-soft);font-weight:700}
.subchips{margin-top:10px;padding:10px;border-radius:12px;background:rgba(255,255,255,.3)}
.sl2{font-size:11.5px;font-weight:800;color:var(--ink-soft);margin-bottom:6px}
.chip.sm{font-size:11.5px;padding:4px 9px}.chip small{opacity:.7;font-weight:600}
.sw2{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:800;color:var(--ink);cursor:pointer}
.sw2 input{display:none}.sw2 span{width:38px;height:22px;border-radius:999px;background:rgba(120,130,140,.35);position:relative;transition:.2s}
.sw2 span::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.2s}
.sw2 input:checked+span{background:var(--np)}.sw2 input:checked+span::after{left:19px}

#v3.on,#v4.on{grid-template-columns:300px 1fr;gap:18px;padding:0}
.bd.C{background:rgba(255,255,255,.55);color:var(--ink-soft);border-color:rgba(74,99,112,.35)}
.lf .sum .lab{font-size:13px;font-weight:900;color:var(--ink-soft)}.lf .sum .big{font-size:34px;font-weight:900;letter-spacing:-.02em;color:var(--np)}.lf .sum .sub{font-size:12px;color:var(--ink-soft);line-height:1.5}
.lf .kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.lf .kpis div{background:rgba(255,255,255,.45);border-radius:12px;padding:10px;text-align:center}.lf .kpis b{display:block;font-size:22px;font-weight:900}.lf .kpis span{font-size:11.5px;color:var(--ink-soft);font-weight:700}
.st2{width:100%;border-collapse:collapse;font-size:12.5px}.st2 td{padding:4px 2px;border-bottom:1px solid rgba(255,255,255,.45)}.st2 td:nth-child(2),.st2 td:nth-child(3){text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}.st2 .bd{font-size:10px;padding:1px 6px}
.lf h3 small{font-weight:700;font-size:11px}.chip.nocl{cursor:default}
.tile .kr{font-size:12px;color:var(--ink-soft);font-weight:700}.tile .pr small{font-size:11px;color:var(--ink-soft);font-weight:700}
.lf{padding:20px;display:flex;flex-direction:column;gap:18px;overflow:auto}
.lf h3{font-size:13px;font-weight:900;color:var(--ink-soft);margin:0 0 8px;letter-spacing:.04em}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:5px 11px;border-radius:999px;font-size:12.5px;font-weight:700;cursor:pointer;background:rgba(255,255,255,.45);border:1px solid rgba(255,255,255,.7);color:var(--ink-soft)}
.chip.on{background:var(--np);color:#fff;border-color:var(--np)}
.lf input,.lf select{width:100%;padding:9px 12px;border-radius:10px;border:1px solid rgba(255,255,255,.7);background:rgba(255,255,255,.55);font:inherit;font-size:13px;color:var(--ink)}
.lf .meta{font-size:12px;line-height:1.6;color:var(--ink-soft)}
.lf .meta b{color:var(--ink)}
.lib{overflow:auto;padding:2px 6px 30px 2px}
.lib .gh{font-size:18px;font-weight:900;margin:8px 4px 12px;display:flex;align-items:center;gap:10px}
.lib .gh small{font-size:13px;color:var(--ink-soft);font-weight:700}
.lgrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px;margin-bottom:26px}
.tile{display:flex;flex-direction:column;border-radius:14px;overflow:hidden;padding:0}
.tile .im{display:block;aspect-ratio:3/4;background:rgba(255,255,255,.75);position:relative}
.tile .im img{width:100%;height:100%;object-fit:contain;display:block;transition:transform .25s}
.tile .im:hover img{transform:scale(1.04)}
.tile .im .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:900;color:rgba(62,47,132,.45);font-size:15px;text-align:center;padding:12px}
.tile .im img+.ph{display:none}
.tile .bd2{padding:10px 12px 12px;display:flex;flex-direction:column;gap:6px}
.tile .t2{font-size:13.5px;font-weight:800;line-height:1.4;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;min-height:3.9em}
.tile dl{display:grid;grid-template-columns:52px 1fr;gap:2px 6px;font-size:12px;line-height:1.45;margin:0}
.tile dt{color:var(--ink-soft);font-weight:700}.tile dd{margin:0;min-width:0;overflow-wrap:anywhere}
.st{padding:2px 8px;border-radius:6px;font-size:11px;font-weight:900;color:#fff}
.st.s1{background:var(--np)}.st.s2{background:#2a9fb3}.st.s3{background:#8a96a0}.st.s4{background:transparent;color:var(--ink-soft);border:1px dashed var(--ink-soft)}
.shop{font-size:11px;font-weight:800;color:var(--ink-soft)}
.tile .pr{font-size:15px;font-weight:900;color:var(--ink)}
.tile .dl{color:var(--cherry);font-weight:800}

.toggle{margin-left:auto;position:relative;display:grid;grid-template-columns:repeat(4,96px);align-items:center;height:40px;border-radius:999px;padding:4px;font-size:15px;font-weight:700;color:var(--ink-soft);user-select:none;cursor:pointer}
.toggle .lb{position:relative;z-index:1;text-align:center;transition:color .3s}
.toggle .lb.on{color:#fff;font-weight:900}
.toggle .pill{position:absolute;top:4px;bottom:4px;left:4px;width:96px;border-radius:999px;background:linear-gradient(210deg,#7a6bd0,var(--np));box-shadow:0 2px 8px rgba(40,20,100,.35),inset 0 1px 0 rgba(255,255,255,.4);transition:transform .32s cubic-bezier(.3,.7,.2,1)}
.toggle[data-i="1"] .pill{transform:translateX(96px)}.toggle[data-i="2"] .pill{transform:translateX(192px)}.toggle[data-i="3"] .pill{transform:translateX(288px)}
.sw{position:relative;width:64px;height:32px;border-radius:999px;padding:0}
.sw .knob{position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;
  background:linear-gradient(210deg,#7a6bd0,var(--np));box-shadow:0 2px 8px rgba(40,20,100,.35),inset 0 1px 0 rgba(255,255,255,.4);transition:left .3s cubic-bezier(.3,.7,.2,1)}
.toggle.cal .sw .knob{left:35px}
main{min-height:0;position:relative}
.view{position:absolute;inset:0;display:none}.view.on{display:grid}
/* ===== 탭1 ===== */
#v1{grid-template-columns:300px 150px 1fr;gap:14px}
.urgent{padding:16px;overflow:auto}
.h2{font-size:15px;font-weight:800;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.u-item{display:grid;grid-template-columns:58px 1fr;gap:10px;padding:9px 10px;margin-bottom:8px;border-radius:12px;cursor:pointer}
.dday{font-weight:800;font-size:13px;color:#fff;background:linear-gradient(210deg,#7a6bd0,var(--np));border-radius:8px;display:flex;align-items:center;justify-content:center;height:28px}
.u-item .t{font-size:13px;font-weight:700;line-height:1.35}.u-item .d{font-size:12px;color:var(--ink-soft);margin-top:2px}
.toc{padding:22px 0 22px 18px;display:flex;flex-direction:column;gap:2px}
.toc a{display:block;padding:9px 10px 9px 12px;border-left:2px solid rgba(255,255,255,.45);color:var(--ink-soft);font-size:14px;font-weight:600;text-decoration:none;cursor:pointer;transition:color .2s,border-color .2s}
.toc a:hover{color:var(--ink)}
.toc a.on{border-left:3px solid var(--np);color:var(--np);font-weight:900}
.feed{overflow-y:auto;min-height:0;padding:0 6px 60vh 2px;scroll-behavior:smooth}
.sec{margin-bottom:30px}
.sec-h{font-size:20px;font-weight:900;padding:12px 18px;margin-bottom:14px}
.sub-h{font-size:16px;font-weight:900;color:var(--np);margin:22px 4px 12px;padding-left:12px;border-left:3px solid var(--np)}
.sec-h+.sub-h{margin-top:4px}
.toc a.sub{padding:5px 10px 5px 26px;font-size:12.5px;font-weight:600}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.card{padding:16px;display:flex;flex-direction:column;gap:12px}
.card.new{border:2px solid var(--cherry);box-shadow:0 0 0 3px rgba(224,69,123,.22),0 8px 28px rgba(30,60,70,.10)}
/* 이미지 슬라이드 */
.car{position:relative;height:300px;border-radius:12px;overflow:hidden;background:rgba(160,175,185,.45);border:1px solid rgba(255,255,255,.55)}
.car .track{display:flex;height:100%;transition:transform .3s ease}
.car .sl{flex:0 0 100%;height:100%}
.car .sl img{width:100%;height:100%;object-fit:cover;display:block}
.car .z{position:absolute;top:0;bottom:0}
.car .zl{left:0;width:20%;cursor:pointer}.car .zr{right:0;width:20%;cursor:pointer}.car .zc{left:20%;width:60%;cursor:zoom-in}
.car .zl::after,.car .zr::after{content:"";position:absolute;inset:0;opacity:0;transition:opacity .2s}
.car .zl::after{background:linear-gradient(90deg,rgba(0,0,0,.28),transparent)}
.car .zr::after{background:linear-gradient(270deg,rgba(0,0,0,.28),transparent)}
.car .zl:hover::after,.car .zr:hover::after{opacity:1}
.car .zl::before,.car .zr::before{position:absolute;top:50%;transform:translateY(-50%);font-size:34px;color:#fff;opacity:0;transition:opacity .2s;z-index:1;text-shadow:0 2px 6px rgba(0,0,0,.4)}
.car .zl::before{content:"‹";left:16px}.car .zr::before{content:"›";right:16px}
.car .zl:hover::before,.car .zr:hover::before{opacity:1}
.car.single .zl,.car.single .zr{display:none}.car.single .zc{left:0;width:100%}
.car.empty .z{display:none}
.car .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px;font-size:20px;font-weight:900;color:rgba(62,47,132,.55);letter-spacing:.02em}
.car .sl img~.ph,.car .track:not(:empty)~.ph{display:none}
.dots{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);display:flex;gap:6px;pointer-events:none}
.dots i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.55);box-shadow:0 1px 3px rgba(0,0,0,.3)}
.dots i.on{background:#fff}
.car.single .dots,.car.empty .dots{display:none}
.badges{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.bd{font-size:12px;font-weight:800;padding:2px 10px;border-radius:999px;border:1px solid rgba(255,255,255,.65)}
.bd.JP{background:var(--jp);color:#fff}.bd.KR{background:var(--kr);color:#fff}
.bd.S{background:linear-gradient(210deg,#fbefc8,var(--gold));color:#4d3700}
.bd.A{background:var(--np);color:#fff}
.bd.B{background:#fff;color:var(--np);border-color:var(--np)}
.bd.rec{background:rgba(255,255,255,.7);color:var(--np);border-color:var(--np-2)}
.bd.who{background:rgba(255,255,255,.62);color:var(--ink)}
.bd.newb{background:var(--cherry);color:#fff}
.bd.chg{background:#fff;color:var(--cherry);border-color:var(--cherry)}
.card .t{font-size:19px;font-weight:900;line-height:1.35;letter-spacing:-.01em}
.fields{display:grid;grid-template-columns:96px 1fr;gap:6px 10px;font-size:13.5px;line-height:1.5}
.fields dd{margin:0;min-width:0;overflow-wrap:anywhere}
.fields dt{color:var(--ink-soft);font-weight:700}
.fields dd.chg{color:var(--cherry);font-weight:800}
.fields dd .old{color:var(--ink-soft);text-decoration:line-through;font-weight:500;margin-left:8px;font-size:12.5px}
.links{display:flex;gap:6px;flex-wrap:wrap}
.lk{font-size:12.5px;text-decoration:none;color:#fff;background:var(--np);padding:5px 12px;border-radius:9px;border:1px solid rgba(255,255,255,.45)}
.lk:hover{background:var(--np-2)}
.clist{padding:16px 18px;font-size:14px;line-height:1.9;color:var(--ink-soft)}
.clist a{color:var(--np)}
/* 확대 보기 */
#lb{position:fixed;inset:0;z-index:50;background:rgba(10,20,30,.82);display:none;align-items:center;justify-content:center}
#lb.on{display:flex}
#lb img{max-width:90vw;max-height:88vh;object-fit:contain;border-radius:8px;box-shadow:0 10px 40px rgba(0,0,0,.5)}
#lb .z{position:absolute;top:0;bottom:0}
#lb .zl{left:0;width:20%;cursor:pointer}#lb .zr{right:0;width:20%;cursor:pointer}#lb .zc{left:20%;width:60%;cursor:zoom-out}
#lb .zl::before,#lb .zr::before{position:absolute;top:50%;transform:translateY(-50%);font-size:54px;color:rgba(255,255,255,.75)}
#lb .zl::before{content:"‹";left:4vw}#lb .zr::before{content:"›";right:4vw}
#lb.single .zl,#lb.single .zr{display:none}#lb.single .zc{left:0;width:100%}
/* ===== 탭2 ===== */
#v2{grid-template-columns:1fr 360px;gap:14px}
.calwrap{display:grid;grid-template-rows:auto auto 1fr;min-height:0;padding:14px 16px}
.calhead{display:flex;align-items:center;gap:10px;padding:2px 4px 8px;position:relative}
.ym{font-size:24px;font-weight:900}
.ym .num{cursor:pointer;padding:2px 8px;border-radius:10px}.ym .num:hover{background:rgba(255,255,255,.4)}
.picker{position:absolute;top:44px;z-index:20;padding:8px;display:none;max-height:300px;overflow:auto}
.picker.on{display:grid;grid-template-columns:repeat(3,64px);gap:6px}
.picker .op{padding:6px 0;text-align:center;border-radius:9px;cursor:pointer;font-weight:700;font-size:14px}
.picker .op:hover{background:rgba(255,255,255,.5)}.picker .op.cur{background:var(--np);color:#fff}
.todayBtn{margin-left:auto;cursor:pointer;border:none;font:inherit;color:var(--ink);padding:7px 14px;font-size:14px;border-radius:12px}
.dow{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;font-size:12px;font-weight:800;color:var(--ink-soft);padding:0 2px 6px}
.dow span{padding-left:6px}.dow span:nth-child(6){color:#3b4fb8}.dow span:nth-child(7){color:#b23a52}
.scroller{position:relative;overflow-y:scroll;min-height:0;scroll-snap-type:y mandatory;overscroll-behavior:contain}
.month{scroll-snap-align:center;scroll-snap-stop:always;padding:2px;transition:opacity .35s,filter .35s;display:grid;grid-template-rows:18px 1fr}
.month.dim{opacity:.45;filter:blur(2px)}
.mlabel{font-size:11.5px;font-weight:800;color:var(--ink-soft);padding-left:4px}
.weeks{display:grid;gap:6px;min-height:0}
.week{position:relative;min-height:0}
.wbg{position:absolute;inset:0;display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day{border-radius:10px;padding:4px 6px;background:rgba(255,255,255,.34);border:1px solid rgba(255,255,255,.62);box-shadow:0 2px 8px rgba(30,60,70,.07),inset 0 1px 0 rgba(255,255,255,.5)}
.day.we{background:rgba(236,242,250,.40)}
.day.out{opacity:.28}
.day .n{font-size:11.5px;font-weight:800;color:var(--ink-soft)}
.day.sat .n{color:#3b4fb8}.day.sun .n,.day.hol .n{color:#b23a52}
.day .hn{font-size:10.5px;font-weight:700;color:#b23a52;margin-left:5px}
.day.today{border:2px solid var(--np);background:rgba(120,100,200,.20)}
.day.today .n{color:var(--np)}
.evl{position:absolute;left:0;right:0;top:22px;bottom:4px;display:grid;grid-template-columns:repeat(7,1fr);column-gap:6px;row-gap:3px;
  grid-auto-rows:30px;grid-auto-flow:row dense;overflow:hidden;padding:0 4px;pointer-events:none}
.ev{pointer-events:auto;display:flex;align-items:center;gap:5px;font-size:12px;border-radius:5px;overflow:hidden;cursor:pointer;background:var(--np-bg);color:#fff;min-width:0}
.ev .bar{align-self:stretch;width:4px;background:var(--np);flex:none}
.ev.past{background:var(--grey-bg)}.ev.past .bar{background:var(--grey)}
.ev.cont .bar{background:transparent}
.ev.td{background:rgba(255,255,255,.72);color:var(--np)}.ev.td .bar{background:#fff}
.ev .rg{flex:none;font-size:8.5px;font-weight:900;padding:0 3px;border-radius:3px;color:#fff;line-height:13px}
.ev .rg.JP{background:var(--jp)}.ev .rg.KR{background:var(--kr)}
.ev .lg{flex:none;height:24px;width:auto;max-width:96px;object-fit:contain;filter:drop-shadow(0 0 1px rgba(255,255,255,.95)) drop-shadow(0 0 1px rgba(255,255,255,.95)) drop-shadow(0 1px 2px rgba(10,5,40,.45))}
.ev.past .lg{opacity:.7}
.more{position:absolute;z-index:2;height:18px;line-height:18px;font-size:11px;font-weight:900;color:var(--np);background:rgba(255,255,255,.85);border:1px solid rgba(62,47,132,.3);border-radius:9px;padding:0 7px;cursor:pointer}
.more:hover{background:#fff}
.dlist{display:flex;flex-direction:column;gap:6px}.dlist a{display:flex;gap:6px;align-items:center;padding:8px 10px;border-radius:10px;background:rgba(255,255,255,.5);cursor:pointer;font-size:13px;font-weight:700}.dlist a:hover{background:rgba(255,255,255,.8)}.dlist img{height:16px;max-width:60px;object-fit:contain}
.ev .tx{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:6px;font-weight:700}
.ev:not(.td) .tx{text-shadow:0 1px 1px rgba(20,10,60,.3)}
.ev.td .tx{font-weight:900}
.ev.sel{outline:2px solid var(--cherry);outline-offset:-1px}
.detail{padding:18px;overflow:auto;display:flex;flex-direction:column;gap:10px}
.detail .t{font-size:19px;font-weight:900;line-height:1.35}
.detail .fields{font-size:13px;grid-template-columns:84px 1fr}
</style>
</head>
<body>
<svg id="tri" preserveAspectRatio="none"></svg>
<div id="logoBg"></div>
<div class="app">
  <header class="glass">
    <div>
      <div class="title">서브컬쳐 브리핑</div>
      <div class="upd"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>최근 업데이트 : 2026.11.03.</div>

/* ===== 유틸 ===== */
const $=q=>document.querySelector(q);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const NOW=new Date(),TODAY=new Date(NOW.getFullYear(),NOW.getMonth(),NOW.getDate());
const P=s=>{const[y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
const DD=d=>Math.round((d-TODAY)/864e5);
const addD=(d,n)=>new Date(d.getFullYear(),d.getMonth(),d.getDate()+n);
const GR={S:0,A:1,B:2,"":2,rec:3};
const KIND=t=>/페스티벌|코믹월드|TOUR|라이브|팝업|KPF|수족관|도쿄돔/.test(t)?0:/발매|권|くじ/.test(t)?1:/마감/.test(t)?2:3;
const GL={S:"S",A:"A",B:"B",rec:"추천"};

/* ===== 배경 파편 ===== */
(function(){const svg=$("#tri"),W=innerWidth,H=innerHeight;svg.setAttribute("viewBox",`0 0 ${W} ${H}`);
  let seed=11;const r=()=>(seed=(seed*9301+49297)%233280)/233280;let h="";
  for(let i=0;i<72;i++){const big=i<8,s=big?120+r()*140:(i<26?28+r()*60:6+r()*20),cx=r()*W,cy=r()*H,a=r()*Math.PI*2;
    const pts=[0,1,2].map(k=>{const t=a+k*2.094+(r()-.5)*1.1,rr=s*(.55+r()*.6);return `${(cx+Math.cos(t)*rr).toFixed(1)},${(cy+Math.sin(t)*rr).toFixed(1)}`}).join(" ");
    const op=big?(.07+r()*.08):(.14+r()*.22);
    h+=r()<.3?`<polygon points="${pts}" fill="none" stroke="white" stroke-opacity="${(op*1.5).toFixed(2)}" stroke-width="${big?1.5:1}"/>`:`<polygon points="${pts}" fill="white" fill-opacity="${op.toFixed(2)}"/>`}
  svg.innerHTML=h})();

const tg=$("#toggle");
function show(v){tg.dataset.i={v1:0,v2:1,v3:2,v4:3}[v];tg.querySelectorAll(".lb").forEach(l=>l.classList.toggle("on",l.dataset.v===v));
  document.querySelectorAll(".view").forEach(x=>x.classList.toggle("on",x.id===v));
  if(v==="v2")requestAnimationFrame(()=>{sizeMonths();go(CENTER,false)})}
tg.onclick=e=>{const lb=e.target.closest(".lb");if(lb)show(lb.dataset.v)};

/* ===== 탭1 ===== */
const badge=(cls,txt)=>`<span class="bd ${cls}">${esc(txt)}</span>`;
let CID=0;const CARS={};
function carousel(imgs,ph){const id="c"+(CID++);const ims=(imgs||[]).slice(0,3);CARS[id]={imgs:ims,i:0};
  const cls=ims.length===0?" empty":ims.length===1?" single":"";
  return `<div class="car${cls}" id="${id}"><div class="track">${ims.map(u=>`<div class="sl"><img src="${u}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()"></div>`).join("")}</div>
   <div class="z zl" data-a="prev"></div><div class="z zc" data-a="zoom"></div><div class="z zr" data-a="next"></div>
   <div class="dots">${ims.map((_,k)=>`<i class="${k?"":"on"}"></i>`).join("")}</div>${ims.length?"":`<div class="ph">${esc(ph||"")}</div>`}</div>`}
function carGo(id,i){const c=CARS[id],n=c.imgs.length;if(n<2)return;c.i=(i+n)%n;const el=document.getElementById(id);
  el.querySelector(".track").style.transform=`translateX(-${c.i*100}%)`;el.querySelectorAll(".dots i").forEach((d,k)=>d.classList.toggle("on",k===c.i))}
const card=it=>{const chg=it.f.some(x=>x[2]);
  return `<article class="card glass${it.isNew?" new":""}">${carousel(it.imgs,it.who)}
   <div class="badges">${badge(it.r,it.r)}${it.g?badge(it.g,GL[it.g]):""}${badge("who",it.who)}${it.isNew?badge("newb","NEW"):""}${chg?badge("chg",it.r==="JP"?"更新":"변경"):""}</div>
   <div class="t">${esc(it.t)}</div>
   <dl class="fields">${it.f.map(([k,v,o])=>`<dt>${esc(k)}</dt><dd class="${o?"chg":""}">${esc(v)}${o&&o!=="—"?`<span class="old">${esc(o)}</span>`:""}</dd>`).join("")}</dl>
   ${it.links.length?`<div class="links">${it.links.map(([n,u])=>`<a class="lk" href="${u}" target="_blank" rel="noopener">${esc(n)}</a>`).join("")}</div>`:""}
  </article>`};
const SUBS=["피규어","쿠지","아크릴·소품","음반","의류·잡화","팝업·콜라보","도서"];
const GO={S:0,A:1,B:2,"":3};
const TOCS=[];
$("#feed").innerHTML=SECS.map(s=>{TOCS.push([s.id,s.name.replace(" 소식",""),0]);
  const subs=SUBS.filter(n=>s.items.some(it=>it.sub===n));
  if(!subs.length)return `<section class="sec" id="sec-${s.id}"><div class="sec-h glass">${s.name}</div><div class="cards">${s.items.map(card).join("")}</div></section>`;
  return `<section class="sec" id="sec-${s.id}"><div class="sec-h glass">${s.name}</div>${subs.map((n,k)=>{const id=s.id+"-"+k;TOCS.push([id,n,1]);
    const its=s.items.filter(it=>it.sub===n).map((it,i)=>[it,i]).sort((a,b)=>GO[a[0].g]-GO[b[0].g]||a[1]-b[1]).map(x=>x[0]);
    return `<div class="sub-h" id="sec-${id}">${n}</div><div class="cards">${its.map(card).join("")}</div>`}).join("")}</section>`}).join("");
$("#toc").innerHTML=TOCS.map(([id,n,sub])=>`<a data-id="${id}" class="${sub?"sub":""}">${n}</a>`).join("");
const feed=$("#feed");
const relTop=s=>s.getBoundingClientRect().top-feed.getBoundingClientRect().top;
$("#toc").onclick=e=>{const a=e.target.closest("a");if(!a)return;const s=document.getElementById("sec-"+a.dataset.id);feed.scrollTo({top:feed.scrollTop+relTop(s),behavior:"smooth"})};
function tocActive(){let cur=TOCS[0][0];for(const[id]of TOCS){const s=document.getElementById("sec-"+id);if(relTop(s)<=80)cur=id}
  document.querySelectorAll("#toc a").forEach(a=>a.classList.toggle("on",a.dataset.id===cur))}
feed.addEventListener("scroll",tocActive);tocActive();
feed.addEventListener("click",e=>{const z=e.target.closest(".car .z");if(!z)return;const el=z.closest(".car"),id=el.id,c=CARS[id];
  if(z.dataset.a==="prev")carGo(id,c.i-1);else if(z.dataset.a==="next")carGo(id,c.i+1);else openLB(id)});
/* 확대 */
const lb=$("#lb");let LBID=null;
function lbShow(){const c=CARS[LBID];lb.querySelector("img").src=c.imgs[c.i];lb.classList.toggle("single",c.imgs.length<2)}
function openLB(id){if(!CARS[id].imgs.length)return;LBID=id;lbShow();lb.classList.add("on")}
lb.querySelector(".zl").onclick=()=>{carGo(LBID,CARS[LBID].i-1);lbShow()};
lb.querySelector(".zr").onclick=()=>{carGo(LBID,CARS[LBID].i+1);lbShow()};
lb.querySelector(".zc").onclick=()=>lb.classList.remove("on");
addEventListener("keydown",e=>{if(e.key==="Escape")lb.classList.remove("on")});

/* 임박 일정 */
(function(){const up=EV.filter(e=>DD(P(e.e||e.s))>=0).sort((a,b)=>P(a.s)-P(b.s));
  $("#urgentList").innerHTML=up.slice(0,12).map(e=>{const n=DD(P(e.s)),ne=DD(P(e.e||e.s)),lab=n>0?"D-"+n:(n===0?"D-DAY":(ne===0?"오늘 마감":"~D-"+ne));

  if(TODAY<a||TODAY>b)return[[a,b,false]];const r=[];if(TODAY>a)r.push([a,addD(TODAY,-1),false]);r.push([TODAY,TODAY,true]);if(TODAY<b)r.push([addD(TODAY,1),b,false]);return r}
/* 일정 작품 판별: e.w가 있으면 우선, 없으면 제목·내용의 작품명으로. 로고는 A등급 이상 작품만 */
const EVW=[["블루아카이브",/블루\s?아카이브|블아|ブルアカ|ブルーアーカイブ|Blue ?Archive|키보토스|キヴォトス|ゲーム開発部|게임개발부|샬레|シャーレ|プラナ|프라나|세이아|키사키/i],["봇치 더 록",/봇치|ぼっち|결속\s?밴드|結束バンド|bocchi/i],["초카구야공주",/초카구야|超かぐや|카구야공주/]];
const evWork=e=>e.w||((EVW.find(([,r])=>r.test(e.t))||EVW.find(([,r])=>r.test(e.m||""))||[])[0]||"");
const evLogo=e=>WLOGO[evWork(e)]||"";
function fitEv(){sc.querySelectorAll(".week").forEach(wk=>{wk.querySelectorAll(".more").forEach(x=>x.remove());const L=wk.querySelector(".evl");const evs=[...L.querySelectorAll(".ev")];evs.forEach(x=>x.style.display="");
  const H=L.clientHeight,cnt=[0,0,0,0,0,0,0];
  evs.forEach(x=>{if(x.offsetTop+x.offsetHeight>H-20){x.style.display="none";const m=x.style.gridColumn.match(/(\d+)\s*\/\s*span\s*(\d+)/);if(m)for(let c=+m[1]-1;c<+m[1]-1+(+m[2]);c++)cnt[c]++}});
  const days=wk.querySelectorAll(".wbg .day");const ws=+wk.dataset.ws;
  cnt.forEach((n,c)=>{if(!n)return;const d=days[c];const b=document.createElement("div");b.className="more";b.textContent="+"+n;b.style.left=(d.offsetLeft+d.offsetWidth-44)+"px";b.style.top=(d.offsetTop+d.offsetHeight-21)+"px";
   b.onclick=ev=>{ev.stopPropagation();dayList(new Date(ws+c*864e5))};wk.appendChild(b)})})}
function dayList(d){const k=+d;const a=EVS.filter(e=>e.S<=d&&e.E>=d);
  $("#detail").innerHTML=`<div class="t">${d.getMonth()+1}월 ${d.getDate()}일 일정 ${a.length}건</div><div class="dlist">${a.map(e=>`<a data-i="${e.i}">${badge(e.r,e.r)}${e.g?badge(e.g,e.g):""}${evLogo(e)?`<img src="${evLogo(e)}" alt="">`:""}<span>${esc(e.t)}</span></a>`).join("")}</div>`;
  $("#detail").querySelectorAll(".dlist a").forEach(x=>x.onclick=()=>detail(+x.dataset.i))}
function build(){
  sc.innerHTML=`<div class="pad"></div>`+MONTHS.map((m,mi)=>{
    const y=m.getFullYear(),mo=m.getMonth(),first=new Date(y,mo,1),off=(first.getDay()+6)%7,weeks=Math.ceil((off+new Date(y,mo+1,0).getDate())/7);
    const mS=first,mE=new Date(y,mo+1,0);let w="";
    for(let k=0;k<weeks;k++){
      const ws=addD(first,-off+k*7),we=addD(ws,6);let bg="";
      for(let c=0;c<7;c++){const d=addD(ws,c);const hk=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`,hn=HOL[hk];
        bg+=`<div class="day${d.getMonth()!==mo?" out":""}${(c===5||c===6)?" we":""}${c===5?" sat":""}${c===6?" sun":""}${hn?" hol":""}${+d===+TODAY?" today":""}"><div class="n">${d.getDate()}${hn?`<span class="hn">${hn}</span>`:""}</div></div>`}
      const lo=ws<mS?mS:ws,hi=we>mE?mE:we;let ev="";
      EVS.forEach(e=>{if(e.E<lo||e.S>hi)return;const a=e.S<lo?lo:e.S,b=e.E>hi?hi:e.E;
        segs(a,b).forEach(([sa,sb,td],si)=>{
          const c1=(sa.getDay()+6)%7+1,span=Math.round((sb-sa)/864e5)+1,past=e.E<TODAY&&!td,cont=sa>e.S;
          const head=!cont;
          ev+=`<div class="ev${past?" past":""}${cont?" cont":""}${td?" td":""}" style="grid-column:${c1}/span ${span}" data-i="${e.i}"><span class="bar"></span>${head?`<span class="rg ${e.r}">${e.r}</span>`:""}${head&&evLogo(e)?`<img class="lg" src="${evLogo(e)}" alt="">`:""}<span class="tx">${cont?"↳ ":""}${esc(e.t)}</span></div>`})});
      w+=`<div class="week" data-ws="${+ws}" data-lo="${+lo}" data-hi="${+hi}"><div class="wbg">${bg}</div><div class="evl">${ev}</div></div>`}
    return `<div class="month" data-mi="${mi}"><div class="mlabel">${y}년 ${String(mo+1).padStart(2,"0")}월</div><div class="weeks" style="grid-template-rows:repeat(${weeks},minmax(0,1fr))">${w}</div></div>`;
  }).join("")+`<div class="pad"></div>`;
  sc.querySelectorAll(".ev").forEach(el=>el.onclick=()=>detail(+el.dataset.i));
}
function sizeMonths(){const H=sc.clientHeight,mh=Math.round(H*.84),pad=Math.round((H-mh)/2);
  sc.querySelectorAll(".month").forEach(m=>m.style.height=mh+"px");sc.querySelectorAll(".pad").forEach(p=>p.style.height=pad+"px");sc.dataset.mh=mh;requestAnimationFrame(fitEv)}
const topOf=i=>i*(+sc.dataset.mh);
function setActive(i){cur=Math.max(0,Math.min(MONTHS.length-1,i));sc.querySelectorAll(".month").forEach((m,k)=>m.classList.toggle("dim",k!==cur));
  const d=MONTHS[cur];$("#yNum").textContent=d.getFullYear();$("#mNum").textContent=String(d.getMonth()+1).padStart(2,"0");
  $("#todayBtn").style.visibility=cur===CENTER?"hidden":"visible"}
function go(i,sm=true){i=Math.max(0,Math.min(MONTHS.length-1,i));setActive(i);sc.scrollTo({top:topOf(i),behavior:sm?"smooth":"auto"})}
let lock=false;
sc.addEventListener("wheel",e=>{e.preventDefault();if(lock||Math.abs(e.deltaY)<4)return;lock=true;go(cur+(e.deltaY>0?1:-1));setTimeout(()=>lock=false,450)},{passive:false});
let st;sc.addEventListener("scroll",()=>{clearTimeout(st);st=setTimeout(()=>{const i=Math.round(sc.scrollTop/(+sc.dataset.mh));if(i!==cur)setActive(i);if(Math.abs(sc.scrollTop-topOf(i))>2)go(i)},120)});
addEventListener("keydown",e=>{if(!$("#v2").classList.contains("on"))return;
  if(["ArrowDown","PageDown"].includes(e.key)){e.preventDefault();go(cur+1)}if(["ArrowUp","PageUp"].includes(e.key)){e.preventDefault();go(cur-1)}});
addEventListener("resize",()=>{sizeMonths();go(cur,false)});
$("#todayBtn").onclick=()=>go(CENTER);
const pk=$("#picker");
function openPicker(kind,anchor){const d=MONTHS[cur],y=d.getFullYear();let ops=[];
  if(kind==="y")ops=[...new Set(MONTHS.map(m=>m.getFullYear()))].map(v=>({label:v,cur:v===y,fn:()=>{
      const same=MONTHS.findIndex(m=>m.getFullYear()===v&&m.getMonth()===d.getMonth());if(same>=0)return go(same);
      const idx=MONTHS.map((m,i)=>[m,i]).filter(([m])=>m.getFullYear()===v).map(([,i])=>i);go(v<y?idx[idx.length-1]:idx[0])}}));
  else ops=MONTHS.map((m,i)=>[m,i]).filter(([m])=>m.getFullYear()===y).map(([m,i])=>({label:String(m.getMonth()+1).padStart(2,"0"),cur:i===cur,fn:()=>go(i)}));
  pk.innerHTML=ops.map((o,k)=>`<div class="op${o.cur?" cur":""}" data-k="${k}">${o.label}</div>`).join("");
  pk.querySelectorAll(".op").forEach(el=>el.onclick=ev=>{ev.stopPropagation();pk.classList.remove("on");ops[+el.dataset.k].fn()});
  pk.style.left=anchor.offsetLeft+"px";pk.classList.add("on")}
$("#yNum").onclick=e=>{e.stopPropagation();openPicker("y",e.target)};
$("#mNum").onclick=e=>{e.stopPropagation();openPicker("m",e.target)};
document.addEventListener("click",()=>pk.classList.remove("on"));
function detail(i,mark=true){
  sc.querySelectorAll(".ev.sel").forEach(x=>x.classList.remove("sel"));if(mark)sc.querySelectorAll(`.ev[data-i="${i}"]`).forEach(x=>x.classList.add("sel"));
  const e=EV[i],E=P(e.e||e.s),S0=P(e.s),past=E<TODAY,n=DD(S0);
  const st=past?"지난 일정":(n<=0?"진행 중":"D-"+n);
  $("#detail").innerHTML=`<div class="badges">${badge(e.r,e.r)}${e.g?badge(e.g,GL[e.g]):""}${badge("who",st)}</div>
   <div class="t">${esc(e.t)}</div>
   <dl class="fields"><dt>일정</dt><dd>${e.s}${e.e?" ~ "+e.e:""}</dd><dt>내용</dt><dd>${esc(e.m)}</dd></dl>
   ${e.l.length?`<div class="links">${e.l.map(([a,u])=>`<a class="lk" href="${u}" target="_blank" rel="noopener">${esc(a)}</a>`).join("")}</div>`:""}`}
build();
const nxt=EV.map((e,i)=>[e,i]).filter(([e])=>P(e.e||e.s)>=TODAY).sort((a,b)=>P(a[0].s)-P(b[0].s))[0];if(nxt)detail(nxt[1],false);
</script>
</body>
